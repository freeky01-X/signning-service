services:
  # 前端服务
  sign-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sign-frontend:latest
    container_name: sign-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sign-backend-pg
    networks:
      - sign-network

  # 后端服务（PostgreSQL版本）
  sign-backend-pg:
    build:
      context: ./backend
      dockerfile: Dockerfile.pg
    image: sign-backend-pg:latest
    container_name: sign-backend-pg
    environment:
      TZ: UTC
    ports:
      - "19099:9099"
    depends_on:
      sign-pg:
        condition: service_healthy
      sign-redis:
        condition: service_healthy
    networks:
      - sign-network

  # PostgreSQL服务
  sign-pg:
    image: postgres:14
    container_name: sign-pg
    environment:
      TZ: UTC
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sign-service
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "15432:5432"
    volumes:
      - ./backend/sql/pg.sql:/docker-entrypoint-initdb.d/pg.sql
    networks:
      - sign-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  sign-redis:
    image: redis:latest
    container_name: sign-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    networks:
      - sign-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  sign-network:
    name: sign-network
    driver: bridge
