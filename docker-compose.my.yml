services:
  # 前端服务
  sign-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sign-frontend:latest
    container_name: sign-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./frontend/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sign-backend-my
    networks:
      - sign-network

  # 后端服务（MySQL版本）
  sign-backend-my:
    build:
      context: ./backend
      dockerfile: Dockerfile.my
    image: sign-backend-my:latest
    container_name: sign-backend-my
    environment:
      TZ: UTC
    ports:
      - "19099:9099"
    depends_on:
      sign-mysql:
        condition: service_healthy
      sign-redis:
        condition: service_healthy
    networks:
      - sign-network

  # MySQL服务
  sign-mysql:
    image: mysql:8.0
    container_name: sign-mysql
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sign-service
    ports:
      - "13306:3306"
    volumes:
      - ./backend/sql/sign-service.sql:/docker-entrypoint-initdb.d/sign-service.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - sign-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  sign-redis:
    image: redis:latest
    container_name: sign-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    networks:
      - sign-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  sign-network:
    name: sign-network
    driver: bridge
